<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Saída Prevista — Simulador</title>
  <style>
    :root {
      --bg: #0f0f13;
      --fg: #e9e9ee;
      --muted: #a8a8b3;
      --card: #16161d;
      --accent: #5b8cff;
      --accent-2: #6ee7b7;
      --border: #262633;
      --input: #1d1d27;
      --shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    /* tema claro */
    .theme-light {
      --bg: #f7f7fb;
      --fg: #1b1b21;
      --muted: #5a5a66;
      --card: #ffffff;
      --accent: #2f6fff;
      --accent-2: #16a34a;
      --border: #e8e8ef;
      --input: #ffffff;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(91,140,255,.15), transparent 60%),
                  radial-gradient(900px 700px at 120% 10%, rgba(110,231,183,.12), transparent 60%),
                  var(--bg);
      color: var(--fg);
      line-height: 1.4;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px clamp(16px, 2.5vw, 32px) 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(20px, 2.4vw, 28px);
      margin: 0;
      letter-spacing: .2px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: clamp(16px, 2.4vw, 28px);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 680px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    }

    label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
    .row { display: flex; align-items: center; gap: 10px; }

    input[type="time"],
    input[type="number"],
    .fake-input {
      width: 100%;
      padding: 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--fg);
      font-size: 16px;
      outline: none;
    }
    input[type="time"]:focus,
    input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      width: fit-content;
    }
    .checkbox input { accent-color: var(--accent); width: 18px; height: 18px; }

    .range-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .pill {
      border: 1px solid var(--border);
      background: var(--input);
      border-radius: 999px;
      padding: 8px 12px;
      font-variant-numeric: tabular-nums;
    }

    .results {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }
    .result {
      display: grid;
      gap: 4px;
      padding: 14px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: linear-gradient(0deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent);
    }
    .result .title { font-size: 13px; color: var(--muted); }
    .result .value { font-size: 22px; font-weight: 600; letter-spacing: .3px; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); box-shadow: none; }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

    /* botão sol e lua */
    .theme-toggle {
      position: relative;
      width: 54px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      display: grid;
      align-items: center;
      padding: 0 4px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(180deg, #fff, #e6e6e6);
      transition: transform .25s ease;
      display: grid;
      place-items: center;
      font-size: 14px;
    }
    .theme-light .thumb { transform: translateX(0); }
    .theme-dark .thumb { transform: translateX(24px); background: linear-gradient(180deg, #24242a, #16161d); color: #ffd76a; }

    .footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
    .mark { color: var(--accent); }

    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 2px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--input); color: var(--fg); }
  </style>
</head>
<body class="theme-dark">
  <div class="wrap">
    <header>
      <h1>Simulador de Saída Prevista</h1>
      <div class="theme-toggle" id="themeToggle" role="button" aria-label="Alternar tema" title="Alternar claro e escuro">
        <div class="thumb" id="themeThumb">☀️</div>
      </div>
    </header>

    <div class="card">
      <div class="grid grid-2">
        <div>
          <label for="entrada">Horário de entrada</label>
          <input id="entrada" type="time" step="60" value="07:50" />
        </div>

        <div>
          <label for="sextaCurta">Opções do dia</label>
          <div class="checkbox">
            <input id="sextaCurta" type="checkbox" />
            <span>Sexta curta</span>
          </div>
        </div>

        <div style="grid-column: 1 / -1;">
          <label for="extras">Horas extras do dia</label>
          <div class="range-wrap">
            <input id="extras" type="range" min="0" max="120" step="5" value="0" />
            <div class="pill"><span id="extrasOut">0</span> min</div>
          </div>
          <div class="footer">Lembrete: é permitido solicitar até 2 horas extras por dia.</div>
        </div>
      </div>

      <div class="actions" style="margin-top: 16px;">
        <button id="calcBtn">Calcular saída</button>
        <button class="secondary" id="limpar">Limpar</button>
      </div>

      <div class="results">
        <div class="result">
          <div class="title">Saída prevista</div>
          <div class="value" id="saidaPrevista">—</div>
        </div>
        <div class="result">
          <div class="title">Carga do dia considerada</div>
          <div class="value" id="cargaDia">—</div>
        </div>
      </div>

      <div class="footer">
        <!-- Preferências ficam salvas no seu navegador. Para recomputar rapidamente você pode pressionar <span class="kbd">Enter</span>. -->
      </div>
    </div>
  </div>

  <script>
    // Configurações fixas
    const DURACAO_PADRAO = 590; // segunda a quinta: 9h 50m = 590 min
    const DURACAO_SEXTA = 490;  // sexta curta: 8h 10m = 490 min
    const ALMOCO = 90;          // 1h30 de almoço

    // Elementos
    const entradaEl = document.getElementById('entrada');
    const sextaEl = document.getElementById('sextaCurta');
    const extrasEl = document.getElementById('extras');
    const extrasOutEl = document.getElementById('extrasOut');
    const saidaEl = document.getElementById('saidaPrevista');
    const cargaEl = document.getElementById('cargaDia');
    const calcBtn = document.getElementById('calcBtn');
    const limparBtn = document.getElementById('limpar');
    const themeToggle = document.getElementById('themeToggle');
    const themeThumb = document.getElementById('themeThumb');
    const body = document.body;

    // Utilidades
    function hhmmToMin(hhmm) {
      if (!hhmm || !hhmm.includes(':')) return null;
      const [h, m] = hhmm.split(':').map(Number);
      if (Number.isNaN(h) || Number.isNaN(m)) return null;
      return h * 60 + m;
    }

    function minToHHMM(totalMin) {
      const m = ((totalMin % (24*60)) + (24*60)) % (24*60);
      const h = Math.floor(m / 60);
      const mm = m % 60;
      return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }

    function formatDuracao(min) {
      const h = Math.floor(min / 60);
      const m = min % 60;
      return `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
    }

    function getDuracaoDia() {
      return sextaEl.checked ? DURACAO_SEXTA : DURACAO_PADRAO;
    }

    function calcular() {
      const entrada = hhmmToMin(entradaEl.value);
      if (entrada === null) {
        saidaEl.textContent = 'Informe um horário válido';
        cargaEl.textContent = '—';
        return;
      }
      const duracao = getDuracaoDia();
      const extras = Number(extrasEl.value) || 0;
      const total = entrada + duracao + extras;

      // Saída prevista continua igual
      saidaEl.textContent = minToHHMM(total);

      // Agora desconta 1h30 (90 min) na carga exibida
      const cargaComAlmoco = duracao + extras - ALMOCO;
      cargaEl.textContent = formatDuracao(cargaComAlmoco);

      salvarPreferencias();
    }

    function salvarPreferencias() {
      const prefs = {
        entrada: entradaEl.value,
        sextaCurta: sextaEl.checked,
        extras: extrasEl.value,
        theme: body.classList.contains('theme-light') ? 'light' : 'dark'
      };
      localStorage.setItem('simuladorPrefs', JSON.stringify(prefs));
    }

    function carregarPreferencias() {
      try {
        const raw = localStorage.getItem('simuladorPrefs');
        if (!raw) return;
        const p = JSON.parse(raw);
        if (p.entrada) entradaEl.value = p.entrada;
        if (typeof p.sextaCurta === 'boolean') sextaEl.checked = p.sextaCurta;
        if (p.extras) extrasEl.value = p.extras;
        atualizaExtrasOut();
        if (p.theme === 'light') setTheme('light');
        if (p.theme === 'dark') setTheme('dark');
      } catch {}
    }

    function atualizaExtrasOut() {
      extrasOutEl.textContent = extrasEl.value;
    }

    // Tema
    function setTheme(mode) {
      body.classList.remove('theme-light','theme-dark');
      if (mode === 'light') {
        body.classList.add('theme-light');
        themeThumb.textContent = '☀️';
      } else {
        body.classList.add('theme-dark');
        themeThumb.textContent = '🌙';
      }
      salvarPreferencias();
    }

    function toggleTheme() {
      const isLight = body.classList.contains('theme-light');
      setTheme(isLight ? 'dark' : 'light');
    }

    // Eventos
    calcBtn.addEventListener('click', calcular);
    limparBtn.addEventListener('click', () => {
      entradaEl.value = '07:50';
      sextaEl.checked = false;
      extrasEl.value = 0;
      atualizaExtrasOut();
      saidaEl.textContent = '—';
      cargaEl.textContent = '—';
      salvarPreferencias();
      entradaEl.focus();
    });

    entradaEl.addEventListener('change', calcular);
    sextaEl.addEventListener('change', calcular);
    extrasEl.addEventListener('input', () => { atualizaExtrasOut(); calcular(); });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') calcular();
    });

    themeToggle.addEventListener('click', toggleTheme);

    (function init() {
      const hasPrefs = !!localStorage.getItem('simuladorPrefs');
      if (!hasPrefs && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        setTheme('light');
      } else {
        carregarPreferencias();
      }
      atualizaExtrasOut();
      calcular();
    })();
  </script>
</body>
</html>
